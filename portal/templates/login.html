<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — L2-COS Operations Portal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            border: 1px solid #d9dce1;
            border-radius: 8px;
            padding: 32px;
            width: 320px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .login-box h1 {
            font-size: 1.2rem;
            margin: 0 0 4px 0;
        }
        .login-box p.subtitle {
            color: #6b7280;
            font-size: 0.85rem;
            margin: 0 0 20px 0;
        }
        .login-box input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 1rem;
            letter-spacing: 0.2em;
            border: 1px solid #ccd0d6;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #1f2937;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #111827;
        }
        .error-message {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>L2-COS Operations Portal</h1>
        <p class="subtitle">Enter PIN to continue</p>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="pin" inputmode="numeric" autocomplete="off"
                   placeholder="PIN" autofocus required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>

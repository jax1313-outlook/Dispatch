[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cin-lite"
version = "0.1.0"
description = "Contract intelligence pipeline — acquire, analyze, route, and archive federal opportunities."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "loguru>=0.7",
]

[project.optional-dependencies]
claude = [
    "anthropic>=0.40",
]
dev = [
    "anthropic>=0.40",
    "pytest>=7.0",
    "coverage>=7.0",
    "bandit>=1.7",
]

[project.scripts]
cin-lite = "cin_lite.run:main"

[tool.setuptools.packages.find]
include = ["cin_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["cin_lite"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

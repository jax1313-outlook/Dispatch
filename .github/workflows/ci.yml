name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cin_lite/requirements.txt
          pip install -r portal/requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite with coverage
        run: |
          set -o pipefail
          python -m pytest \
            --cov=cin_lite \
            --cov=dispatch \
            --cov=portal \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            -q --tb=short 2>&1 | tee pytest-output.txt

      # A run that fails with "Process completed with exit code 1" and nothing
      # else tells the person reading the failure email nothing at all, and the
      # log itself needs a token to fetch. This puts the names of the failing
      # tests where they can be read without one: in the run's annotations and
      # in its summary.
      - name: Name the failures where they can be read
        if: ${{ failure() }}
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -40 | while read -r line; do
            echo "::error title=pytest::${line}"
          done
          {
            echo "### pytest (py${{ matrix.python-version }})"
            echo '```'
            grep -E '^(FAILED|ERROR) |^[0-9]+ (passed|failed)|passed|failed|Required test coverage' \
              pytest-output.txt | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
